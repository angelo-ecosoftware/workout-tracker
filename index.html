    <script>
      // If a cached PWA Service Worker mistakenly intercepted sitemap.xml or robots.txt navigation,
      // unregister it, clear caches, and reload so the browser directly receives the raw server XML / plain text response.
      (function() {
        var path = window.location.pathname;
        if (path === '/sitemap.xml' || path === '/robots.txt') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs.length > 0) {
                Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                        window.location.reload();
                      });
                    });
                  } else {
                    window.location.reload();
                  }
                });
              }
            });
          }
        }
      })();

      // Capture beforeinstallprompt before React loads so it is never missed
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new Event('deferredpromptready'));
      });
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || e.message === 'Script error') {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
